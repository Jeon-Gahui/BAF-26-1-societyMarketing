<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>역삼1동 화재 및 소방시설 분석 지도</title>
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=YOUR_KAKAO_JS_KEY&libraries=clusterer,visualization&autoload=false"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{width:100%;height:100%;overflow:hidden;}
    body{font-family:'Malgun Gothic',sans-serif;display:flex;flex-direction:column;}

    #header{
      background:linear-gradient(135deg,#c0392b,#e74c3c);
      color:#fff;padding:12px 18px;
      display:flex;align-items:center;gap:10px;flex-shrink:0;
    }
    #header h1{font-size:17px;font-weight:700;}
    #badge{margin-left:auto;font-size:12px;background:rgba(255,255,255,.2);padding:3px 10px;border-radius:12px;}

    #controls{
      background:#fff;padding:8px 16px;
      display:flex;gap:14px;align-items:center;flex-wrap:wrap;
      border-bottom:1px solid #e8e8e8;flex-shrink:0;
    }
    .ctrl{display:flex;align-items:center;gap:6px;font-size:13px;}
    .ctrl label{font-weight:600;color:#333;}
    select{border:1px solid #ddd;border-radius:6px;padding:4px 8px;font-size:13px;}
    #map{flex:1;width:100%;}

    /* 상세정보 패널 (오른쪽 아래) */
    #panel{
      position:absolute;bottom:28px;right:12px;
      background:#fff;border-radius:12px;padding:15px;
      box-shadow:0 4px 20px rgba(0,0,0,.15);
      font-size:13px;min-width:240px;display:none;z-index:10;
    }
    #panel h3{font-size:14px;color:#c0392b;margin-bottom:9px;border-bottom:1px solid #eee;padding-bottom:6px;}
    .pr{display:flex;justify-content:space-between;margin-bottom:6px;gap:8px;}
    .pl{color:#999;white-space:nowrap;}
    .pv{font-weight:600;color:#333;text-align:right;}
    .dong-info { color: #2980b9; font-weight: bold; } /* 행정동 강조 */
    #panel button{margin-top:8px;width:100%;padding:7px;background:#e74c3c;color:#fff;border:none;border-radius:7px;cursor:pointer;}
  </style>
</head>
<body>

<div id="header">
  <span>🚒</span>
  <h1>역삼1동 화재 및 소방용수시설 분석</h1>
  <span id="badge">데이터 로딩 중...</span>
</div>

<div id="controls">
  <!-- 데이터 유형 선택 (화재 vs 소방용수) -->
  <div class="ctrl">
    <label>분석 데이터</label>
    <select id="dataType">
      <option value="FIRE">🔥 화재 발생 데이터</option>
      <option value="WATER">💧 소방용수시설</option>
    </select>
  </div>

  <!-- 화재 필터 (연도) -->
  <div id="fireFilters" class="ctrl">
    <label>연도</label>
    <select id="yearF">
      <option value="전체">전체</option>
      <option value="2024">2024년</option>
      <option value="2023">2023년</option>
    </select>
  </div>

  <!-- 소방용수 필터 (유형코드 1~5) -->
  <div id="waterFilters" class="ctrl" style="display:none;">
    <label>시설유형코드</label>
    <select id="typeF">
      <option value="전체">전체</option>
      <option value="1">1 (지상식소화전)</option>
      <option value="2">2 (지하식소화전)</option>
      <option value="3">3 (급수탑)</option>
      <option value="4">4 (저수조)</option>
      <option value="5">5 (비상소화장치)</option>
    </select>
  </div>

  <div class="ctrl">
    <label>클러스터</label>
    <input type="checkbox" id="clusterT" checked>
  </div>
  <div class="ctrl">
    <label>경계선</label>
    <input type="checkbox" id="boundaryT" checked>
  </div>
</div>

<div id="map"></div>

<!-- 정보 패널 -->
<div id="panel">
  <h3 id="panel-title">📍 상세정보</h3>
  <div id="fire-details">
    <div class="pr"><span class="pl">발생일시</span><span class="pv" id="p-datetime"></span></div>
    <div class="pr"><span class="pl">화재유형</span><span class="pv" id="p-type"></span></div>
    <div class="pr"><span class="pl">시설장소</span><span class="pv" id="p-fclt"></span></div>
  </div>
  <div id="water-details" style="display:none;">
    <div class="pr"><span class="pl">시설번호</span><span class="pv" id="p-w-id"></span></div>
    <div class="pr"><span class="pl">유형코드</span><span class="pv" id="p-w-type"></span></div>
    <div class="pr"><span class="pl">도로명주소</span><span class="pv" id="p-w-addr"></span></div>
  </div>
  <div class="pr" style="margin-top:8px; border-top:1px dashed #eee; padding-top:8px;">
    <span class="pl">행정동</span><span class="pv dong-info" id="p-dong"></span>
  </div>
  <button onclick="document.getElementById('panel').style.display='none'">닫기</button>
</div>

<script>
let FIRE_DATA = [];
let WATER_DATA = [];
const BOUNDARY = [[127.047178,37.503974],[127.042767,37.502622],[127.038399,37.501282],[127.037044,37.500616],[127.038457,37.497532],[127.040888,37.492414],[127.031623,37.48954],[127.027635,37.497964],[127.026486,37.500369],[127.024496,37.504518],[127.02447,37.504572],[127.033887,37.507392],[127.043766,37.510263],[127.044176,37.509202],[127.04487,37.508475],[127.045661,37.507916],[127.045733,37.507866],[127.046411,37.507449],[127.046875,37.507164],[127.046989,37.507093],[127.047279,37.506908],[127.04777,37.506591],[127.048141,37.506207],[127.048257,37.505976],[127.048675,37.50514],[127.04893,37.504631],[127.047178,37.503974]];

let map, clusterer, boundaryPolygon;
let markers = [];

kakao.maps.load(function() {
  map = new kakao.maps.Map(document.getElementById('map'), {
    center: new kakao.maps.LatLng(37.4996, 127.0354),
    level: 4
  });

  clusterer = new kakao.maps.MarkerClusterer({
    map: map, averageCenter: true, minLevel: 3
  });

  drawBoundary();
  
  // 데이터 로드 (화재 CSV 및 소방용수 JSON)
  loadData();

  // 이벤트 리스너
  document.getElementById('dataType').addEventListener('change', function() {
    const isWater = this.value === 'WATER';
    document.getElementById('fireFilters').style.display = isWater ? 'none' : 'flex';
    document.getElementById('waterFilters').style.display = isWater ? 'flex' : 'none';
    render();
  });

  document.getElementById('yearF').addEventListener('change', render);
  document.getElementById('typeF').addEventListener('change', render);
  document.getElementById('clusterT').addEventListener('change', render);
  document.getElementById('boundaryT').addEventListener('change', function() {
    boundaryPolygon.setMap(this.checked ? map : null);
  });
});

async function loadData() {
  // 1. 화재 데이터 (CSV)
  Papa.parse("역삼1동_화재출동.csv", {
    download: true, header: true, dynamicTyping: true, skipEmptyLines: true,
    complete: function(results) {
      FIRE_DATA = results.data.filter(d => d.DAMG_RGN_LAT && d.DAMG_RGN_LOT);
      checkReady();
    }
  });

  // 2. 소방용수시설 데이터 (JSON 변환 파일 사용 권장)
  try {
    const response = await fetch('yeoksam_fire_water.json');
    WATER_DATA = await response.json();
    checkReady();
  } catch (e) {
    console.error("소방용수 데이터를 찾을 수 없습니다. yeoksam_fire_water.json 파일을 확인하세요.");
  }
}

function checkReady() {
  if (FIRE_DATA.length > 0) render();
}

function drawBoundary() {
  var path = BOUNDARY.map(c => new kakao.maps.LatLng(c[1], c[0]));
  boundaryPolygon = new kakao.maps.Polygon({
    map: map, path: path, strokeWeight: 3, strokeColor: '#2980b9', strokeOpacity: 0.8,
    fillColor: '#3498db', fillOpacity: 0.05
  });
}

function render() {
  const mode = document.getElementById('dataType').value;
  const showCluster = document.getElementById('clusterT').checked;
  let filtered = [];

  clusterer.clear();
  markers.forEach(m => m.setMap(null));
  markers = [];

  if (mode === 'FIRE') {
    const year = document.getElementById('yearF').value;
    filtered = FIRE_DATA.filter(d => year === '전체' || String(d.OCRN_YMD).startsWith(year));
  } else {
    const typeCode = document.getElementById('typeF').value;
    filtered = WATER_DATA.filter(d => typeCode === '전체' || String(d.시설유형코드) === typeCode);
  }

  document.getElementById('badge').innerHTML = `총 <strong>${filtered.length}</strong>건`;

  filtered.forEach(d => {
    const lat = mode === 'FIRE' ? d.DAMG_RGN_LAT : d.위도;
    const lng = mode === 'FIRE' ? d.DAMG_RGN_LOT : d.경도;
    
    const marker = new kakao.maps.Marker({
      position: new kakao.maps.LatLng(lat, lng),
      // 소방용수시설은 파란색 계열 아이콘 사용 가능 (기본 마커로 표시)
    });

    kakao.maps.event.addListener(marker, 'click', () => showPanel(d, mode));
    markers.push(marker);
    if (!showCluster) marker.setMap(map);
  });

  if (showCluster) clusterer.addMarkers(markers);
}

function showPanel(d, mode) {
  const panel = document.getElementById('panel');
  const fireDetails = document.getElementById('fire-details');
  const waterDetails = document.getElementById('water-details');
  
  panel.style.display = 'block';

  if (mode === 'FIRE') {
    document.getElementById('panel-title').textContent = '🔥 화재 상세정보';
    fireDetails.style.display = 'block';
    waterDetails.style.display = 'none';
    
    const ymd = String(d.OCRN_YMD);
    document.getElementById('p-datetime').textContent = `${ymd.slice(0,4)}-${ymd.slice(4,6)}-${ymd.slice(6,8)}`;
    document.getElementById('p-type').textContent = d.FIRE_TYPE_NM || '-';
    document.getElementById('p-fclt').textContent = d.FCLT_PLC_MCLSF_NM || '-';
    document.getElementById('p-dong').textContent = '역삼1동'; // 화재 데이터 기반
  } else {
    document.getElementById('panel-title').textContent = '💧 소방용수시설 정보';
    fireDetails.style.display = 'none';
    waterDetails.style.display = 'block';
    
    document.getElementById('p-w-id').textContent = d.시설번호 || '-';
    document.getElementById('p-w-type').textContent = d.시설유형코드 || '-';
    document.getElementById('p-w-addr').textContent = d.소재지도로명주소 || '-';
    document.getElementById('p-dong').textContent = d.행정동.replace('서울특별시 강남구 ', '') || '역삼1동';
  }
}
</script>
</body>
</html>
