<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>역삼1동 화재 및 소방시설 분석 지도</title>
  
  <!-- Stripe 스타일 구현을 위한 Inter 폰트 -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=YOUR_KAKAO_JS_KEY&libraries=clusterer,visualization&autoload=false"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    /* Stripe Design System Tokens */
    :root {
      --stripe-purple: #533afd;
      --stripe-purple-hover: #4434d4;
      --deep-navy: #061b31;
      --slate: #64748d;
      --border-color: #e5edf5;
      --white: #ffffff;
      /* Stripe Signature Shadow */
      --stripe-shadow: rgba(50, 50, 93, 0.25) 0px 50px 100px -20px, rgba(0, 0, 0, 0.3) 0px 30px 60px -30px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--white);
      color: var(--slate);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      /* Stripe Typography DNA */
      font-feature-settings: "ss01" on;
      -webkit-font-smoothing: antialiased;
    }

    /* 원본 11의 헤더 구조 유지 (디자인만 변경) */
    #header {
      padding: 10px 20px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      background: transparent;
      position: absolute;
      top: 0;
      right: 0;
      z-index: 20;
      width: 100%;
      pointer-events: none;
    }
    #badge {
      background: var(--deep-navy);
      color: var(--white);
      padding: 5px 12px;
      border-radius: 4px; /* Stripe style radius */
      font-size: 11px;
      font-weight: 500;
      pointer-events: auto;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    /* 원본 11의 컨트롤바 내용 유지 (디자인만 변경) */
    #controls {
      background: var(--white);
      padding: 12px 20px;
      display: flex;
      gap: 15px;
      border-bottom: 1px solid var(--border-color);
      z-index: 15;
      box-shadow: 0 2px 5px rgba(0,0,0,0.02);
    }
    .ctrl { display: flex; align-items: center; gap: 8px; font-size: 13px; }
    .ctrl label { font-weight: 600; color: var(--deep-navy); }
    select {
      border: 1px solid var(--border-color);
      border-radius: 4px;
      padding: 5px 8px;
      font-size: 13px;
      outline: none;
      background: var(--white);
      color: var(--deep-navy);
    }

    #map { flex: 1; width: 100%; z-index: 1; }

    /* 원본 11의 패널 구조 유지 (Stripe 그림자 및 300 Weight 적용) */
    #panel {
      position: absolute;
      bottom: 30px;
      right: 20px;
      background: var(--white);
      padding: 24px;
      border-radius: 8px;
      box-shadow: var(--stripe-shadow); /* Stripe depth */
      display: none;
      z-index: 10;
      min-width: 300px;
      border: 1px solid var(--border-color);
    }
    #p-title {
      font-size: 22px;
      font-weight: 300; /* Stripe signature weight[cite: 10] */
      margin-bottom: 12px;
      color: var(--deep-navy);
      display: flex;
      align-items: center;
      gap: 6px;
      letter-spacing: -0.02em;
    }
    #p-content {
      line-height: 1.6;
      color: var(--slate);
      font-size: 13.5px;
      margin-bottom: 15px;
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 5px;
      border-bottom: 1px solid #f9f9f9;
      padding-bottom: 5px;
    }
    .info-label { color: #888; min-width: 90px; }
    .info-value { 
      font-weight: 500; 
      color: var(--deep-navy); 
      text-align: right;
      font-feature-settings: "tnum" on; /* Tabular numbers for dates */
    }
    .dong-info {
      padding-top: 12px;
      border-top: 1px dashed var(--border-color);
      font-weight: 600;
      color: var(--stripe-purple);
      text-align: right;
      font-size: 12px;
      text-transform: uppercase;
    }
    
    .btn-close {
      width: 100%;
      padding: 10px;
      background: var(--stripe-purple);
      border: none;
      border-radius: 4px;
      cursor: pointer;
      color: var(--white);
      font-weight: 500;
      transition: background 0.15s ease;
    }
    .btn-close:hover { background: var(--stripe-purple-hover); }
  </style>
</head>
<body>

<div id="header">
  <span id="badge">데이터 로딩 중...</span>
</div>

<div id="controls">
  <div class="ctrl">
    <label>데이터</label>
    <select id="mainMode">
      <option value="FIRE">🔥 화재 발생</option>
      <option value="WATER">💧 소방용수시설</option>
    </select>
  </div>

  <div id="waterFilters" style="display:none;">
    <label>시설유형</label>
    <select id="typeFilter">
      <option value="전체">전체 유형</option>
      <option value="1">지상식 소화전</option>
      <option value="2">지하식 소화전</option>
      <option value="3">급수탑</option>
      <option value="4">저수조</option>
      <option value="5">비상소화장치</option>
    </select>
  </div>

  <div id="fireFilters">
    <label>연도</label>
    <select id="yearFilter">
      <option value="전체">전체 연도</option>
      <option value="2024">2024년</option>
      <option value="2023">2023년</option>
      <option value="2022">2022년</option>
    </select>
  </div>
</div>

<div id="map"></div>

<div id="panel">
  <h3 id="p-title">상세 정보</h3>
  <div id="p-content"></div>
  <div class="dong-info">행정동: <span id="p-dong">-</span></div>
  <button class="btn-close" onclick="document.getElementById('panel').style.display='none'">닫기</button>
</div>

<script>
let FIRE_DATA = [], WATER_DATA = [], map, clusterer, markers = [];

const WATER_TYPE_NAMES = { "1": "지상식 소화전", "2": "지하식 소화전", "3": "급수탑", "4": "저수조", "5": "비상소화장치" };

kakao.maps.load(function() {
  map = new kakao.maps.Map(document.getElementById('map'), {
    center: new kakao.maps.LatLng(37.4996, 127.0354),
    level: 4
  });
  
  clusterer = new kakao.maps.MarkerClusterer({
    map: map, averageCenter: true, minLevel: 3,
    styles: [{
        width: '36px', height: '36px',
        background: '#533afd',
        borderRadius: '4px',
        color: '#fff',
        textAlign: 'center',
        lineHeight: '36px',
        fontSize: '12px',
        fontWeight: '600'
    }]
  });

  loadCSV("역삼1동_화재출동.csv", (data) => { FIRE_DATA = data; render(); });
  loadCSV("yeoksam_fire_water.csv", (data) => { WATER_DATA = data; render(); });

  document.getElementById('mainMode').addEventListener('change', function() {
    const isWater = this.value === 'WATER';
    document.getElementById('waterFilters').style.display = isWater ? 'flex' : 'none';
    document.getElementById('fireFilters').style.display = isWater ? 'none' : 'flex';
    render();
  });
  document.getElementById('typeFilter').addEventListener('change', render);
  document.getElementById('yearFilter').addEventListener('change', render);
});

function loadCSV(file, callback) {
  Papa.parse(file, {
    download: true, header: true, dynamicTyping: true, skipEmptyLines: true,
    complete: (results) => callback(results.data)
  });
}

function render() {
  if (!map) return;
  const mode = document.getElementById('mainMode').value;
  clusterer.clear();
  markers.forEach(m => m.setMap(null));
  markers = [];

  let filtered = [];
  if (mode === 'FIRE') {
    const year = document.getElementById('yearFilter').value;
    filtered = FIRE_DATA.filter(d => d.DAMG_RGN_LAT && (year === '전체' || String(d.OCRN_YMD).startsWith(year)));
  } else {
    const type = document.getElementById('typeFilter').value;
    filtered = WATER_DATA.filter(d => d.위도 && (type === '전체' || String(d.시설유형코드) === type));
  }

  document.getElementById('badge').innerHTML = `현재 필터 데이터: <strong>${filtered.length}</strong>건`;

  filtered.forEach(d => {
    const lat = mode === 'FIRE' ? d.DAMG_RGN_LAT : d.위도;
    const lng = mode === 'FIRE' ? d.DAMG_RGN_LOT : d.경도;
    const marker = new kakao.maps.Marker({ position: new kakao.maps.LatLng(lat, lng) });
    kakao.maps.event.addListener(marker, 'click', () => showPanel(d, mode));
    markers.push(marker);
  });
  clusterer.addMarkers(markers);
}

function showPanel(d, mode) {
  const title = document.getElementById('p-title');
  const content = document.getElementById('p-content');
  const dong = document.getElementById('p-dong');
  document.getElementById('panel').style.display = 'block';

  if (mode === 'FIRE') {
    title.innerHTML = `<span>🔥</span> 화재 사고 상세`;
    const ymd = String(d.OCRN_YMD || '');
    const dateStr = ymd.length === 8 ? `${ymd.slice(0,4)}-${ymd.slice(4,6)}-${ymd.slice(6,8)}` : ymd;
    const tm = String(d.OCRN_TM || '000000').padStart(6, '0');
    content.innerHTML = `
      <div class="info-row"><span class="info-label">발생일시</span><span class="info-value">${dateStr} ${tm.slice(0,2)}:${tm.slice(2,4)}</span></div>
      <div class="info-row"><span class="info-label">화재유형</span><span class="info-value">${d.FIRE_TYPE_NM || '-'}</span></div>
      <div class="info-row"><span class="info-label">발화요인</span><span class="info-value">${d.IGTN_DMNT_SCLSF_NM || '-'}</span></div>
      <div class="info-row"><span class="info-label">연소확대물</span><span class="info-value">${d.CMBS_EXPOBJ_SCLSF_NM || '-'}</span></div>
      <div class="info-row"><span class="info-label">시설장소</span><span class="info-value">${d.FCLT_PLC_LCLSF_NM || ''} > ${d.FCLT_PLC_MCLSF_NM || ''}</span></div>
    `;
    dong.textContent = "역삼1동";
  } else {
    const typeName = WATER_TYPE_NAMES[String(d.시설유형코드)] || "소방시설 상세";
    title.innerHTML = `<span>💧</span> ${typeName}`;
    content.innerHTML = `
      <div class="info-row"><span class="info-label">관리번호</span><span class="info-value">${d.시설번호}</span></div>
      <div class="info-row"><span class="info-label">도로명주소</span><span class="info-value">${d.소재지도로명주소 || '-'}</span></div>
    `;
    dong.textContent = (d.행정동 || "역삼1동").split(' ').pop(); 
  }
}
</script>
</body>
</html>
