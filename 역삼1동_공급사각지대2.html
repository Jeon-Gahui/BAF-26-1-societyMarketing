<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>역삼1동 인프라 사각지대 분석 지도</title>
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=YOUR_KAKAO_JS_KEY&libraries=clusterer,visualization&autoload=false"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Malgun Gothic',sans-serif;display:flex;flex-direction:column;height:100vh;background:#f4f7f6;}
    
    #header{padding:10px 20px;display:flex;justify-content:flex-end;position:absolute;top:0;right:0;z-index:20;width:100%;pointer-events:none;}
    #badge{background:rgba(0,0,0,0.7);color:#fff;padding:6px 15px;border-radius:20px;font-size:12px;pointer-events:auto;}

    /* 왼쪽 상단 컨트롤 레이아웃 */
    #controls{background:#fff;padding:12px 20px;display:flex;gap:15px;border-bottom:1px solid #ddd;z-index:15;box-shadow:0 2px 8px rgba(0,0,0,0.1);}
    .ctrl-group{display:flex;align-items:center;gap:8px;font-size:13px;}
    .ctrl-group label{font-weight:bold;color:#333;}
    select{border:1px solid #ccc;border-radius:5px;padding:4px 8px;font-size:13px;outline:none;}

    #map{flex:1;width:100%;position:relative;}

    /* 오른쪽 아래 상세정보 패널 */
    #panel{
      position:absolute;bottom:25px;right:15px;
      background:#fff;border-radius:12px;padding:18px;
      box-shadow:0 5px 20px rgba(0,0,0,0.2);
      font-size:13px;width:260px;display:none;z-index:10;
      border-top: 4px solid #e74c3c;
    }
    #p-title{font-size:15px;font-weight:bold;margin-bottom:10px;color:#333;}
    #p-content{line-height:1.6;color:#555;margin-bottom:12px;}
    .dong-tag{padding-top:10px;border-top:1px dashed #ddd;text-align:right;font-weight:bold;color:#2980b9;}
    #panel button{width:100%;padding:8px;background:#eee;border:none;border-radius:5px;cursor:pointer;font-weight:bold;color:#666;}
  </style>
</head>
<body>

<div id="header">
  <span id="badge">데이터 로드 중...</span>
</div>

<div id="controls">
  <div class="ctrl-group">
    <label>조회 데이터</label>
    <select id="mainMode">
      <option value="FIRE">🔥 화재 사고</option>
      <option value="WATER">💧 소방용수시설</option>
    </select>
  </div>

  <div id="waterFilters" class="ctrl-group" style="display:none;">
    <label>유형코드</label>
    <select id="typeFilter">
      <option value="전체">전체 유형</option>
      <option value="1">1 (지상식 소화전)</option>
      <option value="2">2 (지하식 소화전)</option>
      <option value="3">3 (급수탑)</option>
      <option value="4">4 (저수조)</option>
      <option value="5">5 (비상소화장치)</option>
    </select>
  </div>

  <div id="fireFilters" class="ctrl-group">
    <label>연도</label>
    <select id="yearFilter">
      <option value="전체">전체 연도</option>
      <option value="2024">2024년</option>
      <option value="2023">2023년</option>
    </select>
  </div>
</div>

<div id="map"></div>

<div id="panel">
  <h3 id="p-title">상세 정보</h3>
  <div id="p-content"></div>
  <div class="dong-tag">행정동: <span id="p-dong">역삼1동</span></div>
  <button onclick="document.getElementById('panel').style.display='none'">닫기</button>
</div>

<script>
let FIRE_DATA = [];
let WATER_DATA = [];
let map, clusterer, markers = [];

// 역삼1동 경계선 좌표[cite: 2, 4]
const YEOKSAM_BOUNDARY = [
  [127.047178, 37.503974], [127.042767, 37.502621], [127.038398, 37.501282], 
  [127.037044, 37.500616], [127.038457, 37.497531], [127.040888, 37.492413], 
  [127.031623, 37.489540], [127.027635, 37.497964], [127.026485, 37.500368], 
  [127.024495, 37.504518], [127.024470, 37.504571], [127.033887, 37.507392], 
  [127.043765, 37.510263], [127.044175, 37.509202], [127.044869, 37.508475], 
  [127.045660, 37.507916], [127.045733, 37.507865], [127.046410, 37.507449], 
  [127.046874, 37.507163], [127.046988, 37.507093], [127.047278, 37.506908], 
  [127.047769, 37.506591], [127.048141, 37.506207], [127.048257, 37.505975], 
  [127.048675, 37.505140], [127.048929, 37.504630], [127.047178, 37.503974]
];

const WATER_NAMES = { "1":"지상식 소화전", "2":"지하식 소화전", "3":"급수탑", "4":"저수조", "5":"비상소화장치" };

kakao.maps.load(function() {
  map = new kakao.maps.Map(document.getElementById('map'), {
    center: new kakao.maps.LatLng(37.4996, 127.0354),
    level: 4
  });
  clusterer = new kakao.maps.MarkerClusterer({ map: map, averageCenter: true, minLevel: 3 });

  drawYeoksamOutline();
  loadAllData();

  document.getElementById('mainMode').addEventListener('change', function() {
    const isWater = this.value === 'WATER';
    document.getElementById('waterFilters').style.display = isWater ? 'flex' : 'none';
    document.getElementById('fireFilters').style.display = isWater ? 'none' : 'flex';
    render();
  });
  document.getElementById('typeFilter').addEventListener('change', render);
  document.getElementById('yearFilter').addEventListener('change', render);
});

// 역삼1동 아웃라인 그리기
function drawYeoksamOutline() {
  const path = YEOKSAM_BOUNDARY.map(c => new kakao.maps.LatLng(c[1], c[0]));
  new kakao.maps.Polygon({
    map: map, path: path,
    strokeWeight: 4, strokeColor: '#FF0000', strokeOpacity: 0.7, strokeStyle: 'solid',
    fillColor: '#FF0000', fillOpacity: 0.05
  }).setMap(map);
}

function loadAllData() {
  loadCSV("역삼1동_화재출동.csv", (data) => { FIRE_DATA = data; render(); });
  loadCSV("yeoksam_fire_water.csv", (data) => { WATER_DATA = data; render(); });
}

function loadCSV(file, callback) {
  Papa.parse(file, {
    download: true, header: true, dynamicTyping: true, skipEmptyLines: true,
    complete: (results) => callback(results.data)
  });
}

function render() {
  const mode = document.getElementById('mainMode').value;
  clusterer.clear();
  markers.forEach(m => m.setMap(null));
  markers = [];

  let displayData = [];
  if (mode === 'FIRE') {
    const year = document.getElementById('yearFilter').value;
    displayData = FIRE_DATA.filter(d => d.DAMG_RGN_LAT && (year === '전체' || String(d.OCRN_YMD).startsWith(year)));
  } else {
    const type = document.getElementById('typeFilter').value;
    displayData = WATER_DATA.filter(d => d.위도 && (type === '전체' || String(d.시설유형코드) === type));
  }

  document.getElementById('badge').innerHTML = `분석 데이터: <strong>${displayData.length}</strong>건`;

  displayData.forEach(d => {
    const lat = mode === 'FIRE' ? d.DAMG_RGN_LAT : d.위도;
    const lng = mode === 'FIRE' ? d.DAMG_RGN_LOT : d.경도;
    const marker = new kakao.maps.Marker({ position: new kakao.maps.LatLng(lat, lng) });
    kakao.maps.event.addListener(marker, 'click', () => showPanel(d, mode));
    markers.push(marker);
  });
  clusterer.addMarkers(markers);
}

function showPanel(d, mode) {
  const title = document.getElementById('p-title');
  const content = document.getElementById('p-content');
  const dong = document.getElementById('p-dong');
  document.getElementById('panel').style.display = 'block';

  if (mode === 'FIRE') {
    title.textContent = "🔥 화재 사고 상세";
    content.innerHTML = `<b>유형</b>: ${d.FIRE_TYPE_NM}<br><b>장소</b>: ${d.FCLT_PLC_MCLSF_NM}<br><b>일자</b>: ${d.OCRN_YMD}`;
    dong.textContent = "역삼1동";
  } else {
    // 유형코드 명칭으로 변환
    const typeName = WATER_NAMES[String(d.시설유형코드)] || "소방시설";
    title.textContent = `💧 ${typeName} 상세`;
    content.innerHTML = `<b>관리번호</b>: ${d.시설번호}<br><b>주소</b>: ${d.소재지도로명주소}`;
    // 엑셀 '행정동' 컬럼에서 동 이름만 추출
    dong.textContent = (d.행정동 || "역삼1동").split(' ').pop(); 
  }
}
</script>
</body>
</html>
