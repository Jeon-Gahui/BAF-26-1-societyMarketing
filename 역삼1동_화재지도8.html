<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>역삼1동 화재 및 소방시설 통합 지도</title>
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=d1ef16dbb5ab92f550db551ef0f15bbd&libraries=clusterer&autoload=false"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    html,body{width:100%;height:100%;overflow:hidden;}
    body{font-family:'Malgun Gothic',sans-serif;display:flex;flex-direction:column;}

    #header{
      background:linear-gradient(135deg,#c0392b,#e74c3c);
      color:#fff;padding:12px 18px;
      display:flex;align-items:center;gap:10px;flex-shrink:0;
    }
    #header h1{font-size:17px;font-weight:700;}
    #badge{margin-left:auto;font-size:12px;background:rgba(255,255,255,.2);padding:3px 10px;border-radius:12px;}

    /* 왼쪽 상단 컨트롤 레이아웃 */
    #controls{
      background:#fff;padding:10px 16px;
      display:flex;gap:15px;align-items:center;flex-wrap:wrap;
      border-bottom:1px solid #e8e8e8;flex-shrink:0;
    }
    .ctrl-group{display:flex;align-items:center;gap:8px;font-size:13px;}
    .ctrl-group label{font-weight:600;color:#333;}
    select{border:1px solid #ddd;border-radius:6px;padding:5px 10px;font-size:13px;outline:none;}
    
    #map{flex:1;width:100%;position:relative;}

    /* 오른쪽 아래 상세정보 패널 */
    #panel{
      position:absolute;bottom:25px;right:15px;
      background:#fff;border-radius:12px;padding:18px;
      box-shadow:0 6px 25px rgba(0,0,0,0.18);
      font-size:13px;width:280px;display:none;z-index:10;
      border:1px solid #eee;
    }
    #panel h3{font-size:15px;color:#c0392b;margin-bottom:12px;border-bottom:2px solid #f8f8f8;padding-bottom:8px;display:flex;align-items:center;gap:5px;}
    .info-row{display:flex;justify-content:space-between;margin-bottom:8px;line-height:1.4;}
    .info-label{color:#888;white-space:nowrap;width:80px;}
    .info-value{font-weight:600;color:#333;text-align:right;word-break:keep-all;}
    .dong-tag{margin-top:10px;padding-top:10px;border-top:1px dashed #ddd;text-align:right;}
    .dong-name{color:#2980b9;font-weight:bold;font-size:14px;}
    #panel button{margin-top:12px;width:100%;padding:8px;background:#f5f5f5;color:#666;border:none;border-radius:6px;cursor:pointer;font-weight:600;}
    #panel button:hover{background:#eee;}
  </style>
</head>
<body>

<div id="header">
  <span>📍</span>
  <h1>역삼1동 화재 안전 지도</h1>
  <span id="badge">데이터 로딩 중...</span>
</div>

<div id="controls">
  <div class="ctrl-group">
    <label>데이터 선택</label>
    <select id="mainMode">
      <option value="FIRE">🔥 화재 발생 이력</option>
      <option value="WATER">💧 소방용수시설</option>
    </select>
  </div>

  <div id="filterSection" class="ctrl-group">
    <div id="fireFilters">
      <label>발생 연도</label>
      <select id="yearFilter">
        <option value="전체">전체 연도</option>
        <option value="2024">2024년</option>
        <option value="2023">2023년</option>
      </select>
    </div>
    <div id="waterFilters" style="display:none;">
      <label>시설유형코드</label>
      <select id="typeFilter">
        <option value="전체">전체 유형</option>
        <option value="1">1 (지상식소화전)</option>
        <option value="2">2 (지하식소화전)</option>
        <option value="3">3 (급수탑)</option>
        <option value="4">4 (저수조)</option>
        <option value="5">5 (비상소화장치)</option>
      </select>
    </div>
  </div>

  <div class="ctrl-group">
    <label>클러스터</label>
    <input type="checkbox" id="useCluster" checked>
  </div>
</div>

<div id="map"></div>

<div id="panel">
  <h3 id="p-title">📍 상세 정보</h3>
  <div id="p-content">
    </div>
  <div class="dong-tag">
    행정동: <span class="dong-name" id="p-dong">-</span>
  </div>
  <button onclick="document.getElementById('panel').style.display='none'">닫기</button>
</div>

<script>
let FIRE_DATA = [];
let WATER_DATA = [];
let markers = [];
let map, clusterer;

// 카카오맵 초기화
kakao.maps.load(function() {
  const container = document.getElementById('map');
  const options = {
    center: new kakao.maps.LatLng(37.4996, 127.0354),
    level: 4
  };
  map = new kakao.maps.Map(container, options);
  clusterer = new kakao.maps.MarkerClusterer({
    map: map, averageCenter: true, minLevel: 3
  });

  loadAllData();
});

// 데이터 로드 함수
async function loadAllData() {
  const badge = document.getElementById('badge');
  try {
    // 1. 화재 데이터 (CSV)
    const fireResponse = await fetch('역삼1동_화재출동.csv');
    const fireCsv = await fireResponse.text();
    Papa.parse(fireCsv, {
      header: true, dynamicTyping: true, skipEmptyLines: true,
      complete: function(results) {
        FIRE_DATA = results.data.filter(d => d.DAMG_RGN_LAT && d.DAMG_RGN_LOT);
        console.log("화재 데이터 로드 완료:", FIRE_DATA.length);
        checkAndRender();
      }
    });

    // 2. 소방용수 데이터 (JSON)
    const waterResponse = await fetch('yeoksam_fire_water.json');
    if (waterResponse.ok) {
      WATER_DATA = await waterResponse.json();
      console.log("소방용수 데이터 로드 완료:", WATER_DATA.length);
      checkAndRender();
    }
  } catch (e) {
    console.error("데이터 로딩 중 에러:", e);
    badge.textContent = "데이터 로딩 에러";
  }
}

function checkAndRender() {
  if (FIRE_DATA.length > 0 || WATER_DATA.length > 0) render();
}

// 이벤트 리스너 설정
document.getElementById('mainMode').addEventListener('change', function() {
  const isWater = this.value === 'WATER';
  document.getElementById('fireFilters').style.display = isWater ? 'none' : 'block';
  document.getElementById('waterFilters').style.display = isWater ? 'block' : 'none';
  render();
});
document.getElementById('yearFilter').addEventListener('change', render);
document.getElementById('typeFilter').addEventListener('change', render);
document.getElementById('useCluster').addEventListener('change', render);

// 지도 그리기
function render() {
  const mode = document.getElementById('mainMode').value;
  const useCluster = document.getElementById('useCluster').checked;
  
  clusterer.clear();
  markers.forEach(m => m.setMap(null));
  markers = [];

  let displayData = [];
  if (mode === 'FIRE') {
    const year = document.getElementById('yearFilter').value;
    displayData = FIRE_DATA.filter(d => year === '전체' || String(d.OCRN_YMD).startsWith(year));
  } else {
    const type = document.getElementById('typeFilter').value;
    displayData = WATER_DATA.filter(d => type === '전체' || String(d.시설유형코드) === type);
  }

  document.getElementById('badge').innerHTML = `조회 결과: <strong>${displayData.length}</strong>건`;

  displayData.forEach(d => {
    const lat = mode === 'FIRE' ? d.DAMG_RGN_LAT : d.위도;
    const lng = mode === 'FIRE' ? d.DAMG_RGN_LOT : d.경도;
    
    const marker = new kakao.maps.Marker({
      position: new kakao.maps.LatLng(lat, lng)
    });

    kakao.maps.event.addListener(marker, 'click', () => showPanel(d, mode));
    markers.push(marker);
    if (!useCluster) marker.setMap(map);
  });

  if (useCluster) clusterer.addMarkers(markers);
}

// 정보 패널 표시
function showPanel(d, mode) {
  const panel = document.getElementById('panel');
  const content = document.getElementById('p-content');
  const dongText = document.getElementById('p-dong');
  const title = document.getElementById('p-title');

  panel.style.display = 'block';
  content.innerHTML = '';

  if (mode === 'FIRE') {
    title.innerHTML = '🔥 화재 사고 정보';
    const ymd = String(d.OCRN_YMD);
    const dateStr = `${ymd.slice(0,4)}-${ymd.slice(4,6)}-${ymd.slice(6,8)}`;
    
    content.innerHTML = `
      <div class="info-row"><span class="info-label">발생일시</span><span class="info-value">${dateStr}</span></div>
      <div class="info-row"><span class="info-label">화재유형</span><span class="info-value">${d.FIRE_TYPE_NM || '-'}</span></div>
      <div class="info-row"><span class="info-label">장소분류</span><span class="info-value">${d.FCLT_PLC_MCLSF_NM || '-'}</span></div>
      <div class="info-row"><span class="info-label">인명피해</span><span class="info-value">${(d.PSN_DMG_CNT || 0)}명</span></div>
    `;
    dongText.textContent = '역삼1동';
  } else {
    title.innerHTML = '💧 소방용수시설 정보';
    content.innerHTML = `
      <div class="info-row"><span class="info-label">시설번호</span><span class="info-value">${d.시설번호}</span></div>
      <div class="info-row"><span class="info-label">유형코드</span><span class="info-value">${d.시설유형코드}번</span></div>
      <div class="info-row"><span class="info-label">도로명주소</span><span class="info-value">${d.소재지도로명주소 || '-'}</span></div>
      <div class="info-row"><span class="info-label">관리기관</span><span class="info-value">${d.관할소방서명 || '-'}</span></div>
    `;
    // 행정동 정보에서 "서울특별시 강남구" 등 중복 부분 제거 후 표시
    dongText.textContent = (d.행정동 || '역삼1동').replace('서울특별시 강남구 ', '');
  }
}
</script>
</body>
</html>
