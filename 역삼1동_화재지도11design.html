<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>역삼1동 데이터 분석 지도</title>
  
  <!-- Fonts: Copernicus/StyreneB 대체 폰트 -->
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  
  <script src="https://dapi.kakao.com/v2/maps/sdk.js?appkey=d1ef16dbb5ab92f550db551ef0f15bbd&libraries=clusterer,visualization&autoload=false"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    /* Claude Style Variable System */
    :root {
      --color-canvas: #faf9f5;
      --color-primary: #cc785c; /* Coral */
      --color-primary-active: #a9583e;
      --color-ink: #141413;
      --color-body: #3d3d3a;
      --color-surface-card: #efe9de;
      --color-hairline: #e6dfd8;
      --font-display: 'Cormorant Garamond', serif;
      --font-body: 'Inter', sans-serif;
    }

    *{margin:0;padding:0;box-sizing:border-box;}
    body{
      font-family: var(--font-body);
      background-color: var(--color-canvas);
      color: var(--color-body);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    
    /* Header & Badge Styling */
    #header-info {
      padding: 16px 24px;
      display: flex;
      justify-content: flex-end;
      position: absolute;
      top: 0;
      right: 0;
      z-index: 20;
      width: 100%;
      pointer-events: none;
    }
    #badge {
      background: var(--color-ink);
      color: var(--color-canvas);
      padding: 4px 14px;
      border-radius: 9999px; /* pill shape */
      font-size: 12px;
      font-weight: 500;
      pointer-events: auto;
      letter-spacing: 0.5px;
    }

    /* Editorial Controls Bar */
    #controls {
      background: var(--color-canvas);
      padding: 16px 32px;
      display: flex;
      gap: 24px;
      align-items: center;
      border-bottom: 1px solid var(--color-hairline);
      z-index: 15;
    }
    .ctrl-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .ctrl-group label {
      font-size: 13px;
      font-weight: 500;
      color: var(--color-ink);
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    select {
      border: 1px solid var(--color-hairline);
      background: #fff;
      border-radius: 8px; /* rounded.md */
      padding: 6px 12px;
      font-size: 14px;
      outline: none;
      color: var(--color-ink);
      cursor: pointer;
    }

    #map {
      flex: 1;
      width: 100%;
      z-index: 1;
    }

    /* Info Panel - Editorial Feature Card Style */
    #panel {
      position: absolute;
      bottom: 32px;
      right: 32px;
      background: var(--color-surface-card);
      border-radius: 12px; /* rounded.lg */
      padding: 32px; /* spacing.xl */
      box-shadow: 0 4px 20px rgba(20,20,19,0.08);
      display: none;
      z-index: 100;
      width: 320px;
      border: 1px solid var(--color-hairline);
    }
    #p-title {
      font-family: var(--font-display);
      font-size: 28px; /* display-sm */
      font-weight: 400;
      line-height: 1.2;
      letter-spacing: -0.3px; /* negative letter-spacing */
      color: var(--color-ink);
      margin-bottom: 20px;
    }
    #p-content {
      font-size: 16px;
      line-height: 1.55;
      color: var(--color-body);
    }
    .info-row {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid var(--color-hairline);
      padding: 8px 0;
    }
    .info-label {
      color: var(--color-body);
      font-size: 13px;
      font-weight: 500;
    }
    .info-value {
      font-weight: 500;
      color: var(--color-ink);
      text-align: right;
    }
    .dong-info {
      margin-top: 24px;
      text-align: right;
      font-size: 13px;
      color: var(--color-primary); /* Coral point */
      font-weight: 500;
    }
    
    .btn-close {
      width: 100%;
      padding: 12px;
      background: var(--color-primary);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      color: #fff;
      font-weight: 500;
      margin-top: 16px;
      transition: background 0.2s;
    }
    .btn-close:hover {
      background: var(--color-primary-active);
    }
  </style>
</head>
<body>

<div id="header-info">
  <span id="badge">LOADING DATA</span>
</div>

<div id="controls">
  <div class="ctrl-group">
    <label>Mode</label>
    <select id="mainMode">
      <option value="FIRE">🔥 화재 발생</option>
      <option value="WATER">💧 소방용수시설</option>
    </select>
  </div>

  <div id="waterFilters" class="ctrl-group" style="display:none;">
    <label>Type</label>
    <select id="typeFilter">
      <option value="전체">전체 유형</option>
      <option value="1">지상식 소화전</option>
      <option value="2">지하식 소화전</option>
      <option value="3">급수탑</option>
      <option value="4">저수조</option>
      <option value="5">비상소화장치</option>
    </select>
  </div>

  <div id="fireFilters" class="ctrl-group">
    <label>Year</label>
    <select id="yearFilter">
      <option value="전체">전체 연도</option>
      <option value="2024">2024년</option>
      <option value="2023">2023년</option>
      <option value="2022">2022년</option>
    </select>
  </div>
</div>

<div id="map"></div>

<div id="panel">
  <h3 id="p-title">📍 상세 정보</h3>
  <div id="p-content"></div>
  <div class="dong-info">REGION: <span id="p-dong">-</span></div>
  <button class="btn-close" onclick="document.getElementById('panel').style.display='none'">CLOSE</button>
</div>

<script>
let FIRE_DATA = [];
let WATER_DATA = [];
let map, clusterer, markers = [];

const WATER_TYPE_NAMES = {
  "1": "지상식 소화전",
  "2": "지하식 소화전",
  "3": "급수탑",
  "4": "저수조",
  "5": "비상소화장치"
};

kakao.maps.load(function() {
  map = new kakao.maps.Map(document.getElementById('map'), {
    center: new kakao.maps.LatLng(37.4996, 127.0354),
    level: 4
  });
  
  // Custom Clusterer Style
  clusterer = new kakao.maps.MarkerClusterer({ 
    map: map, 
    averageCenter: true, 
    minLevel: 3,
    styles: [{
        width: '40px', height: '40px',
        background: '#cc785c',
        borderRadius: '20px',
        color: '#fff',
        textAlign: 'center',
        lineHeight: '40px',
        fontWeight: '500'
    }]
  });

  loadCSV("역삼1동_화재출동.csv", (data) => { FIRE_DATA = data; render(); });
  loadCSV("yeoksam_fire_water.csv", (data) => { WATER_DATA = data; render(); });

  document.getElementById('mainMode').addEventListener('change', function() {
    const isWater = this.value === 'WATER';
    document.getElementById('waterFilters').style.display = isWater ? 'flex' : 'none';
    document.getElementById('fireFilters').style.display = isWater ? 'none' : 'flex';
    render();
  });
  document.getElementById('typeFilter').addEventListener('change', render);
  document.getElementById('yearFilter').addEventListener('change', render);
});

function loadCSV(file, callback) {
  Papa.parse(file, {
    download: true, header: true, dynamicTyping: true, skipEmptyLines: true,
    complete: (results) => callback(results.data)
  });
}

function render() {
  const mode = document.getElementById('mainMode').value;
  clusterer.clear();
  markers.forEach(m => m.setMap(null));
  markers = [];

  let filtered = [];
  if (mode === 'FIRE') {
    const year = document.getElementById('yearFilter').value;
    filtered = FIRE_DATA.filter(d => d.DAMG_RGN_LAT && (year === '전체' || String(d.OCRN_YMD).startsWith(year)));
  } else {
    const type = document.getElementById('typeFilter').value;
    filtered = WATER_DATA.filter(d => d.위도 && (type === '전체' || String(d.시설유형코드) === type));
  }

  document.getElementById('badge').innerHTML = `COUNT: <strong>${filtered.length}</strong>`;

  filtered.forEach(d => {
    const lat = mode === 'FIRE' ? d.DAMG_RGN_LAT : d.위도;
    const lng = mode === 'FIRE' ? d.DAMG_RGN_LOT : d.경도;
    const marker = new kakao.maps.Marker({ position: new kakao.maps.LatLng(lat, lng) });
    kakao.maps.event.addListener(marker, 'click', () => showPanel(d, mode));
    markers.push(marker);
  });
  clusterer.addMarkers(markers);
}

function showPanel(d, mode) {
  const title = document.getElementById('p-title');
  const content = document.getElementById('p-content');
  const dong = document.getElementById('p-dong');
  document.getElementById('panel').style.display = 'block';

  if (mode === 'FIRE') {
    title.innerHTML = `Fire Incident Case`;
    
    const ymd = String(d.OCRN_YMD || '');
    const formattedDate = ymd.length === 8 ? `${ymd.slice(0,4)}-${ymd.slice(4,6)}-${ymd.slice(6,8)}` : ymd;
    const tm = String(d.OCRN_TM || '000000').padStart(6, '0');
    const formattedTime = `${tm.slice(0,2)}:${tm.slice(2,4)}`;

    content.innerHTML = `
      <div class="info-row"><span class="info-label">DATE</span><span class="info-value">${formattedDate}</span></div>
      <div class="info-row"><span class="info-label">TIME</span><span class="info-value">${formattedTime}</span></div>
      <div class="info-row"><span class="info-label">TYPE</span><span class="info-value">${d.FIRE_TYPE_NM || '-'}</span></div>
      <div class="info-row"><span class="info-label">REASON</span><span class="info-value">${d.IGTN_DMNT_SCLSF_NM || '-'}</span></div>
      <div class="info-row"><span class="info-label">PLACE</span><span class="info-value">${d.FCLT_PLC_MCLSF_NM || '-'}</span></div>
    `;
    dong.textContent = "Yeoksam 1-dong";
  } else {
    const typeName = WATER_TYPE_NAMES[String(d.시설유형코드)] || "Infrastructure";
    title.innerHTML = typeName;
    content.innerHTML = `
      <div class="info-row"><span class="info-label">ID</span><span class="info-value">${d.시설번호}</span></div>
      <div class="info-row"><span class="info-label">ADDRESS</span><span class="info-value">${d.소재지도로명주소 || '-'}</span></div>
      <div class="info-row"><span class="info-label">STATUS</span><span class="info-value">Normal</span></div>
    `;
    dong.textContent = "Yeoksam 1-dong";
  }
}
</script>
</body>
</html>
