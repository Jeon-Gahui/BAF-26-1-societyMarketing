  // 표시 범위 제한
  var sw = new kakao.maps.LatLng(VIEW_SW[0], VIEW_SW[1]);
  var ne = new kakao.maps.LatLng(VIEW_NE[0], VIEW_NE[1]);
  map.setBounds(new kakao.maps.LatLngBounds(sw, ne));

  kakao.maps.event.addListener(map, 'dragend', enforceBounds);
  kakao.maps.event.addListener(map, 'zoom_changed', function() {
    if(map.getLevel() > 6) map.setLevel(6);
    enforceBounds();
  });

  drawBoundary();

  clusterer = new kakao.maps.MarkerClusterer({
    map: map, averageCenter: true, minLevel: 4,
    styles:[{
      width:'48px',height:'48px',
      background:'rgba(192,57,43,.88)',borderRadius:'24px',
      color:'#fff',fontWeight:'bold',fontSize:'13px',
      lineHeight:'48px',textAlign:'center',
      border:'3px solid rgba(255,255,255,.7)'
    }]
  });

  renderMarkers();

  document.getElementById('typeF').addEventListener('change', renderMarkers);
  document.getElementById('yearF').addEventListener('change', renderMarkers);
  document.getElementById('clusterT').addEventListener('change', renderMarkers);
  document.getElementById('boundaryT').addEventListener('change', function() {
    var show = this.checked;
    if(boundaryPolygon) boundaryPolygon.setMap(show ? map : null);
    if(boundaryLabel)   boundaryLabel.setMap(show ? map : null);
  });
});

function enforceBounds() {
  var c   = map.getCenter();
  var lat = Math.min(Math.max(c.getLat(), VIEW_SW[0]), VIEW_NE[0]);
  var lng = Math.min(Math.max(c.getLng(), VIEW_SW[1]), VIEW_NE[1]);
  if(lat !== c.getLat() || lng !== c.getLng())
    map.setCenter(new kakao.maps.LatLng(lat, lng));
}

function drawBoundary() {
  var path = BOUNDARY.map(function(c){ return new kakao.maps.LatLng(c[1],c[0]); });
  boundaryPolygon = new kakao.maps.Polygon({
    map: map, path: path,
    strokeWeight:3, strokeColor:'#2980b9', strokeOpacity:.9, strokeStyle:'solid',
    fillColor:'#3498db', fillOpacity:.08
  });
  boundaryLabel = new kakao.maps.CustomOverlay({
    map: map,
    position: new kakao.maps.LatLng(37.4996, 127.0354),
    content: '<div style="background:rgba(41,128,185,.85);color:#fff;font-size:13px;'
           + 'font-weight:700;padding:4px 10px;border-radius:12px;'
           + 'white-space:nowrap;box-shadow:0 1px 4px rgba(0,0,0,.2);">역삼1동</div>',
    yAnchor:.5, xAnchor:.5, zIndex:5
  });
}

function renderMarkers() {
  markers.forEach(function(m){ m.setMap(null); });
  overlays.forEach(function(o){ o.setMap(null); });
  markers=[]; overlays=[];
  if(clusterer) clusterer.clear();

  var type = document.getElementById('typeF').value;
  var year = document.getElementById('yearF').value;
  var useCluster = document.getElementById('clusterT').checked;

  var filtered = FIRE_DATA.filter(function(d){
    var yr = String(d.OCRN_YMD).slice(0,4);
    return (type==='전체'||d.FIRE_TYPE_NM===type)&&(year==='전체'||yr===year);
  });

  document.getElementById('badge').innerHTML='총 <strong>'+filtered.length+'</strong>건';

  filtered.forEach(function(d){
    var pos   = new kakao.maps.LatLng(d.DAMG_RGN_LAT, d.DAMG_RGN_LOT);
    var color = COLOR[d.FIRE_TYPE_NM]||'#888';
    if(useCluster){
      var marker = new kakao.maps.Marker({position:pos});
      (function(data){
        kakao.maps.event.addListener(marker,'click',function(){showPanel(data);});
      })(d);
      markers.push(marker);
    }else{
      var div = document.createElement('div');
      div.style.cssText='width:14px;height:14px;background:'+color
        +';border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);cursor:pointer;';
      (function(data){ div.addEventListener('click',function(){showPanel(data);}); })(d);
      var ov = new kakao.maps.CustomOverlay({position:pos,content:div,yAnchor:.5,xAnchor:.5,zIndex:3});
      ov.setMap(map); overlays.push(ov);
    }
  });

  if(useCluster) clusterer.addMarkers(markers);
}

function showPanel(d){
  var ymd=String(d.OCRN_YMD);
  document.getElementById('p-date').textContent=ymd.slice(0,4)+'년 '+ymd.slice(4,6)+'월 '+ymd.slice(6,8)+'일 '+d.OCRN_HR+'시';
  document.getElementById('p-type').textContent=d.FIRE_TYPE_NM;
  document.getElementById('p-bldg').textContent=d.BLDG_SRTFRM_NM||'-';
  document.getElementById('p-death').textContent=d.DTH_CNT+'명';
  document.getElementById('p-inj').textContent=d.INJPSN_CNT+'명';
  document.getElementById('p-dmg').textContent=Number(d.PRPT_DAM_AMT).toLocaleString()+'천원';
  document.getElementById('panel').style.display='block';
}
</script>
</body>
</html>
